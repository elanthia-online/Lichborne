# "Check zero" in CI (see CLAUDE.md Pre-merge checks): both builds + tsc on
# every push/PR to main. Free on the public repo; a red X here means the commit
# doesn't compile — the same three commands run locally before any merge.
# Deliberately NO packaging, NO release interaction — the Release workflow
# (release.yml) is manual-only and separate.
name: CI

# Quoted because YAML 1.1 parses a bare `on` as boolean true — GitHub accepts
# both, but editors' schema validators flag the bare form.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    # Windows is the primary platform (better-sqlite3's install step is worth
    # exercising where most users run). Ubuntu joined in v0.19.7 (B365): Linux
    # has a case-sensitive filesystem, so it catches a wrong-case import or
    # asset path that Windows silently forgives, and it exercises the native
    # module install the AppImage build depends on — before release night.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:main
      - run: npm run build:renderer
      - run: npx tsc --noEmit
      # The MAIN process has its own tsconfig — the default one never looks at
      # src/main (CLAUDE.md Check zero). Added v0.19.7 (B365) once its one
      # long-standing baseline error was fixed, so this runs clean.
      - run: npx tsc --noEmit -p tsconfig.main.json
      # Semantic check of release.yml + the artifact-name contract. Not a YAML
      # lint — see the script's header for the incident that motivated it.
      # Runs here (not only in the release workflow) so a broken release
      # pipeline is caught on the commit that breaks it, rather than at 2am on
      # release night when a build job dies mid-matrix.
      - run: node .github/scripts/check-workflow.mjs
