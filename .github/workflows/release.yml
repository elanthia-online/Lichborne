# Lichborne release pipeline (CI twin of publish.mjs — which stays untouched
# as the local Windows-only fallback: `$env:GH_TOKEN = '<token>'; node publish.mjs`).
#
# HOW A RELEASE WORKS:
#   1. Bump package.json version, write release-notes.md, commit, push (same as always).
#   2. GitHub → Actions tab → "Release" → Run workflow (manual button; nothing
#      ever builds on plain commits).
#   3. Wait for green (~10-15 min), review the DRAFT release it produced, click
#      Publish on GitHub — identical to the publish.mjs flow. The git tag is
#      only created when Publish is clicked; never tag manually.
#
# Shape: prepare (validate notes + pre-create ONE draft) → build (per-OS
# matrix, each job publishes its artifacts into that draft) → verify (assert
# the full artifact set + refresh notes). The pre-created draft is what stops
# parallel OS jobs from minting duplicate drafts on the same tag — the same
# race publish.mjs step 3 guards against, scaled up from parallel uploads to
# parallel jobs.
#
# ADDING A PLATFORM (e.g. a mac x64 build for an Intel tester): add its matrix
# entry below, its artifact names to PLATFORM_ARTIFACTS in release-verify.mjs,
# AND its token to EXPECTED_PLATFORMS in the verify job — all three must move
# together, or verify passes on a release that silently lacks a platform.
# (Windows, Linux and macOS are all live as of v0.18.0.) Mac note: unsigned
# builds (no Apple Developer account) need CSC_IDENTITY_AUTO_DISCOVERY=false so
# electron-builder doesn't hunt for a signing identity. It does NOT then ad-hoc
# sign for us (an earlier comment here claimed it did — B238 proved otherwise:
# the first Mac tester got "Lichborne is damaged and can't be opened"), so
# build/afterPack.cjs codesigns ad-hoc; arm64 refuses an unsigned binary.
# Users still clear quarantine once (xattr -cr), and auto-update does NOT work
# unsigned (manual downloads per release).
name: Release

# Quoted because YAML 1.1 parses a bare `on` as boolean true — GitHub accepts
# both, but editors' schema validators flag the bare form.
"on":
  workflow_dispatch:

# The built-in GITHUB_TOKEN needs release write access; no PAT/secret setup.
permissions:
  contents: write

# One release run at a time — two concurrent runs would fight over the draft.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate release notes + pre-create draft
        run: node .github/scripts/release-prepare.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prepare
    strategy:
      # Let the other OS jobs finish even if one fails — verify still catches
      # the incomplete artifact set, and the partial draft is reusable on re-run.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis
          # Linux (v0.18.0): AppImage, fully first-class — no signing exists on
          # Linux, auto-update works out of the box via latest-linux.yml.
          - os: ubuntu-latest
            args: --linux
          # Mac (v0.18.0): UNSIGNED beta — deliberately no Apple Developer
          # account (free-project decision, revisit if Mac demand shows).
          # build/afterPack.cjs ad-hoc signs the .app (electron-builder does
          # NOT — B238); users clear quarantine once with `xattr -cr`, and
          # auto-update does NOT work unsigned (main.ts gates it off on darwin).
          # arm64 only (Apple Silicon); add x64 if an Intel-Mac tester appears.
          # When a Developer ID cert lands: add the cert + notarytool secrets,
          # drop CSC_IDENTITY_AUTO_DISCOVERY below, and un-gate the updater.
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build main + renderer
        run: npm run build
      - name: Package and upload to draft
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code signing on ANY platform today (Windows never signed; Mac
          # ships unsigned by decision). Stops electron-builder from hunting
          # for a signing identity in the runner's keychain on mac.
          # KEEP THIS INSIDE THIS STEP'S `env:` — it was once orphaned into the
          # verify step's `run:` below by an edit that anchored on the GH_TOKEN
          # line, which both failed the job (the shell tried to execute
          # `CSC_IDENTITY_AUTO_DISCOVERY:`) and silently un-set the variable, so
          # electron-builder started searching the keychain again. The YAML still
          # PARSED, so a syntax check did not catch it.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Proof IN THE LOG that the packaged .app really carries a signature
      # (B238). We have no Mac to test on, an unsigned arm64 app fails only in a
      # user's hands with "is damaged and can't be opened", and the verify job
      # checks artifact FILENAMES so it would never notice. Note the ordering:
      # this runs AFTER the upload, so it cannot prevent one — the actual gate
      # is build/afterPack.cjs, which throws and aborts the build BEFORE any
      # artifact exists. This step exists so a red job tells you not to hit
      # Publish, and so "did it sign?" is answerable from the log forever after.
      - name: Verify macOS signature
        if: matrix.os == 'macos-latest'
        run: |
          APP=$(find release -maxdepth 2 -name '*.app' -print -quit)
          if [ -z "$APP" ]; then echo "::error::No .app found under release/"; exit 1; fi
          echo "Verifying $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP"

  verify:
    # `needs: build` alone would SKIP this job when any matrix build fails —
    # which is exactly when you most want to be told what the draft is missing.
    # `!cancelled()` runs it after a partial matrix (fail-fast is off, so the
    # other OS jobs still finished) and it exits 1 naming the absent artifacts;
    # gating on prepare's result keeps it from running when there is no draft
    # to inspect at all. A manual cancel still skips it.
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify draft artifact set + refresh notes
        run: node .github/scripts/release-verify.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comma-separated; extend in lockstep with the build matrix above.
          EXPECTED_PLATFORMS: win,linux,mac
